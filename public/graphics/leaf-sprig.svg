<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" role="img" aria-labelledby="title desc">
  <title id="title">Animated gold botanical sprig</title>
  <desc id="desc">A thin gold line-art sprig with small leaves that sways gently from the base.</desc>
  <style>
    .sprig { transform-box: view-box; transform-origin: 40px 112px; animation: sprig-sway 7s ease-in-out infinite; }
    .leaf { animation: leaf-breathe 7s ease-in-out infinite; }
    .leaf-alt { animation-delay: -2.6s; }
    @keyframes sprig-sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes leaf-breathe {
      0%, 100% { opacity: .58; }
      50% { opacity: .88; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="sprig" fill="none" stroke="#BFA76F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 112C39 91 43 72 49 55c5-16 8-30 6-47" stroke-width="1.15" opacity=".82"/>
    <path class="leaf" d="M46 68c-11-1-20-7-27-18 13-1 23 4 29 15" stroke-width="1"/>
    <path class="leaf leaf-alt" d="M51 55c9-6 19-7 29-2-8 9-18 12-29 7" stroke-width=".95"/>
    <path class="leaf" d="M52 39c-9-4-15-12-17-24 12 4 18 11 18 22" stroke-width=".9"/>
    <path class="leaf leaf-alt" d="M55 25c7-7 15-10 25-8-5 10-13 15-24 13" stroke-width=".85"/>
    <path class="leaf" d="M42 86c-9 1-18-2-27-10 10-3 19-1 27 7" stroke-width=".95"/>
  </g>
</svg>
