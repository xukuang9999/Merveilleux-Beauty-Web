<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" role="img" aria-labelledby="title desc">
  <title id="title">Animated rose petal</title>
  <desc id="desc">A soft rose petal with a thin gold edge and a gentle internal sway.</desc>
  <style>
    .petal { transform-box: view-box; transform-origin: 22px 28px; animation: petal-sway 6s ease-in-out infinite; }
    .vein { animation: vein-fade 6s ease-in-out infinite; }
    @keyframes petal-sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes vein-fade {
      0%, 100% { opacity: .24; }
      50% { opacity: .42; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="petalGradient" x1="9" x2="36" y1="45" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C5778A" stop-opacity=".86"/>
      <stop offset=".52" stop-color="#F2D9DE" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FDFAF7" stop-opacity=".76"/>
    </linearGradient>
  </defs>
  <g class="petal">
    <path d="M22 49C9 39 5 26 11 15 15 8 22 4 31 3c5 9 5 19 1 29-3 8-7 13-10 17z" fill="url(#petalGradient)" stroke="#BFA76F" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="vein" d="M22 46c1-11 2-23 8-39" fill="none" stroke="#BFA76F" stroke-width=".65" stroke-linecap="round"/>
    <path class="vein" d="M23 31c-4-2-7-5-9-10M25 24c3-2 5-5 7-9" fill="none" stroke="#BFA76F" stroke-width=".55" stroke-linecap="round"/>
  </g>
</svg>
