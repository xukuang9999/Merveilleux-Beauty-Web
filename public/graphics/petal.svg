<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" role="img" aria-labelledby="mote-title mote-desc">
  <title id="mote-title">Champagne light mote</title>
  <desc id="mote-desc">A soft champagne glow orb drifting like dust in warm light.</desc>
  <defs>
    <radialGradient id="mote-glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#FDFCF8" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#F2ECDF" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#C8B389" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A08C68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mote-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FDFCF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2ECDF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="22" cy="26" rx="15" ry="19" fill="url(#mote-glow)"/>
  <circle cx="22" cy="26" r="5" fill="url(#mote-core)"/>
</svg>
