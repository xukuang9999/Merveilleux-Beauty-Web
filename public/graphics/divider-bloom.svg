<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 32" role="img" aria-labelledby="title desc">
  <title id="title">Animated bloom divider</title>
  <desc id="desc">A slim gold divider with a centered floral diamond motif and a subtle shimmer.</desc>
  <style>
    .motif { transform-box: fill-box; transform-origin: center; animation: motif-pulse 4s ease-in-out infinite; }
    .highlight { animation: shimmer 5.6s ease-in-out infinite; }
    @keyframes motif-pulse {
      0%, 100% { opacity: .68; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes shimmer {
      0% { opacity: 0; transform: translateX(-104px); }
      22%, 48% { opacity: .75; }
      70%, 100% { opacity: 0; transform: translateX(104px); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g fill="none" stroke="#BFA76F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 16h82" stroke-width="1"/>
    <path d="M146 16h82" stroke-width="1"/>
    <g class="highlight" opacity="0">
      <path d="M16 16h34" stroke="#F5EFE0" stroke-width="2"/>
      <path d="M190 16h34" stroke="#F5EFE0" stroke-width="2"/>
    </g>
    <g class="motif">
      <path d="M120 6l10 10-10 10-10-10z" stroke-width="1.05"/>
      <path d="M120 9c-4 1-7 3-10 7 3 4 6 6 10 7 4-1 7-3 10-7-3-4-6-6-10-7z" stroke-width=".8" opacity=".72"/>
      <path d="M102 16c4-4 8-4 12 0M126 16c4-4 8-4 12 0" stroke-width=".8" opacity=".72"/>
      <circle cx="120" cy="16" r="1.5" fill="#BFA76F" stroke="none" opacity=".82"/>
    </g>
  </g>
</svg>
