<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 46" role="img" aria-labelledby="title desc">
  <title id="title">Animated scroll cue</title>
  <desc id="desc">A thin gold rounded mouse outline with a dot that bounces downward and fades.</desc>
  <style>
    .dot { animation: scroll-dot 1.8s ease-in-out infinite; }
    .outline { animation: outline-breathe 3.6s ease-in-out infinite; }
    @keyframes scroll-dot {
      0% { opacity: 0; transform: translateY(0); }
      22% { opacity: 1; }
      72% { opacity: .2; transform: translateY(12px); }
      100% { opacity: 0; transform: translateY(12px); }
    }
    @keyframes outline-breathe {
      0%, 100% { opacity: .58; }
      50% { opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g fill="none" stroke="#BFA76F" stroke-linecap="round" stroke-linejoin="round">
    <rect class="outline" x="5" y="3" width="18" height="32" rx="9" stroke-width="1.15"/>
    <path class="outline" d="M10 40l4 4 4-4" stroke-width="1"/>
    <circle class="dot" cx="14" cy="12" r="1.8" fill="#BFA76F" stroke="none"/>
  </g>
</svg>
